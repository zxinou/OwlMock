name: owlmock

services:
  app:
    image: owlmock:local
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      OWLMOCK_DATA_DIR: /data
      OWLMOCK_COOKIE_SECURE: ${OWLMOCK_COOKIE_SECURE:-false}
      PORT: 8000
      TRACER: ${TRACER:-noop}
    ports:
      - "${OWLMOCK_PORT:-8000}:8000"
    volumes:
      - owlmock-data:/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  owlmock-data:
