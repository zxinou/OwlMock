id: "interviewer-technical"
prompt_template: "data/prompt/interviewer_technical.md"
llm:
  provider: "dashscope"
  model: "qwen3.5-omni-plus-2026-03-15"
  temperature: 0.7
  fallback:
    provider: "zhipu"
    model: "glm-4.6v-flash"
    temperature: 0.7
tools:
  - save_real_question
skills: []
context:
  max_history_tokens: 100000
  compact_threshold: 80000
policy:
  max_steps: 10
  parallel_tools: 3
  tool_timeout: 30.0
realtime:
  provider: "dashscope_realtime"
  model: "qwen3.5-omni-flash-realtime"
  voice: "Cindy"  #台湾甜妹
  vad_mode: "none"
  vad_threshold: 0.5
  transcription:
    enabled: true
    model: "whisper"
  max_session_minutes: 15
  midsummary:
    enabled: true
    interval_minutes: 7 #按realtime模型的最大时长调整
    subagent_profile: "mid-summary-injector"
    timeout_seconds: 5
