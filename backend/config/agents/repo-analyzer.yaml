id: "repo-analyzer"
prompt_template: "data/prompt/repo_analyzer_system_prompt.md"
llm:
  provider: "dashscope"
  model: "qwen3.5-omni-plus-2026-03-15"
  temperature: 0.3
  fallback:
    provider: "zhipu"
    model: "glm-4.6v-flash"
    temperature: 0.3
tools:
  - read_skill
  - clone_repo
  - read_repo_context
  - list_directory
  - read_file
  - search_code
  - save_repo_analysis
skills:
  - "repo-analyzer"
context:
  max_history_tokens: 60000
  compact_threshold: 50000
policy:
  max_steps: 10
  parallel_tools: 1
  tool_timeout: 90.0
