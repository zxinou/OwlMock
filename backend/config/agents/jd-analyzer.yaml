id: "jd-analyzer"
prompt_template: "data/prompt/jd_analyzer.md"
llm:
  provider: "dashscope"
  model: "qwen3.5-omni-plus-2026-03-15"
  temperature: 0.2
  fallback:
    provider: "zhipu"
    model: "glm-4.6v-flash"
    temperature: 0.2
tools: []
skills: []
context:
  max_history_tokens: 100000
  compact_threshold: 80000
policy:
  max_steps: 1
  parallel_tools: 0
  tool_timeout: 0
